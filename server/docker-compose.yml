services:
  db:
    image: postgres:16-alpine
    environment: { POSTGRES_USER: crm, POSTGRES_PASSWORD: crm, POSTGRES_DB: crm }
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
  api:
    build: .
    env_file: .env
    environment: { DATABASE_URL: "postgresql://crm:crm@db:5432/crm?schema=public" }
    ports: ["4000:4000"]
    depends_on: [db]
volumes: { pgdata: {} }
