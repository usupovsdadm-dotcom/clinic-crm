# Production: docker compose -f docker-compose.prod.yml up -d --build
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: crm
      POSTGRES_DB: crm
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U crm"], interval: 10s, retries: 5 }
  api:
    build: .
    restart: unless-stopped
    env_file: .env
    depends_on: { db: { condition: service_healthy } }
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ../web/out:/srv/app:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [api]
volumes:
  pgdata: { name: crm_pgdata, external: true }
  caddy_data: {}
  caddy_config: {}
